<form (ngSubmit)="guardar(forma)" #forma="ngForm" novalidate>
  <p-card>
    <ng-template pTemplate="title">Formulario por Template</ng-template>
    <ng-template pTemplate="subtitle">Validación declarativa con ngModel</ng-template>

    <div class="form-field">
      <label for="nombre">Nombre</label>
      <input
        id="nombre"
        type="text"
        pInputText
        class="full-width"
        placeholder="Nombre"
        name="nombre"
        [(ngModel)]="usuario.nombre"
        minlength="5"
        required
        #nombre="ngModel" />

      <small class="field-error" *ngIf="nombre.errors?.['required'] && nombre.touched">Este campo es obligatorio.</small>
      <small class="field-error" *ngIf="nombre.errors?.['minlength'] && nombre.touched">
        Se necesita un minimo de {{ nombre.errors?.['minlength'].requiredLength }} caracteres.
      </small>
    </div>

    <div class="form-field">
      <label for="apellido">Apellido</label>
      <input
        id="apellido"
        type="text"
        pInputText
        class="full-width"
        placeholder="Apellido"
        name="apellido"
        [(ngModel)]="usuario.apellido"
        required
        #apellido="ngModel" />

      <small class="field-error" *ngIf="apellido.errors?.['required'] && apellido.touched">Este campo es obligatorio.</small>
    </div>

    <div class="form-field">
      <label for="correo">Correo</label>
      <input
        id="correo"
        type="email"
        pInputText
        class="full-width"
        placeholder="Correo electronico"
        name="correo"
        [(ngModel)]="usuario.correo"
        email
        required
        pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$"
        #correo="ngModel" />

      <small class="field-error" *ngIf="correo.errors?.['required'] && correo.touched">Este campo es obligatorio.</small>
      <small class="field-error" *ngIf="correo.errors?.['pattern'] && correo.touched">El formato del correo es incorrecto.</small>
    </div>

    <div class="form-field">
      <label for="pais">Pais</label>
      <p-dropdown
        id="pais"
        [options]="paises"
        optionLabel="nombre"
        optionValue="codigo"
        placeholder="Seleccione un pais"
        styleClass="full-width"
        name="pais"
        [(ngModel)]="usuario.pais">
      </p-dropdown>
    </div>

    <div class="form-field">
      <label>Sexo</label>
      <div class="radio-group">
        <div class="radio-option" *ngFor="let item of sexos">
          <p-radioButton [inputId]="item" name="sexo" [value]="item" [(ngModel)]="usuario.sexo"></p-radioButton>
          <label [for]="item">{{ item }}</label>
        </div>
      </div>
    </div>

    <div class="form-field checkbox-field">
      <p-checkbox [binary]="true" inputId="acepta" name="acepta" [(ngModel)]="usuario.acepta" required></p-checkbox>
      <label for="acepta">Acepta las condiciones</label>
    </div>

    <div class="form-actions">
      <button pButton type="submit" label="Guardar" icon="pi pi-check" [disabled]="!forma.valid"></button>
    </div>
  </p-card>
</form>

<pre class="debug-output">{{ usuario | json }}</pre>
