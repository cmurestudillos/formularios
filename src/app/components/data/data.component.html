<form [formGroup]="forma" (ngSubmit)="guardarCambios()">
  <p-card>
    <ng-template pTemplate="title">Formulario por Data</ng-template>
    <ng-template pTemplate="subtitle">Reactive Forms — FormGroup / FormControl / FormArray</ng-template>

    <div formGroupName="nombreCompleto">
      <div class="form-field">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" pInputText class="full-width" placeholder="Nombre" formControlName="nombre" />

        <small class="field-error" *ngIf="forma.get('nombreCompleto.nombre')?.errors?.['required']">El nombre es obligatorio.</small>
        <small class="field-error" *ngIf="forma.get('nombreCompleto.nombre')?.errors?.['minlength']">Minimo, 3 caracteres.</small>
      </div>

      <div class="form-field">
        <label for="apellido">Apellido</label>
        <input id="apellido" type="text" pInputText class="full-width" placeholder="Apellido" formControlName="apellido" />

        <small class="field-error" *ngIf="forma.get('nombreCompleto.apellido')?.errors?.['required']">El apellido es obligatorio.</small>
      </div>
    </div>

    <div class="form-field">
      <label for="correo">Correo</label>
      <input id="correo" type="email" pInputText class="full-width" placeholder="Correo electronico" formControlName="correo" />

      <small class="field-error" *ngIf="forma.controls['correo'].errors?.['required']">El Correo es obligatorio.</small>
      <small class="field-error" *ngIf="forma.controls['correo'].errors?.['pattern']">El formato es incorrecto.</small>
    </div>

    <div class="form-field">
      <label for="username">Username</label>
      <input id="username" type="text" pInputText class="full-width" placeholder="usuario" formControlName="username" />
    </div>

    <div class="form-field">
      <label for="password1">Password</label>
      <p-password
        inputId="password1"
        styleClass="full-width"
        [inputStyleClass]="'full-width'"
        placeholder="Contraseña"
        formControlName="password1"
        [toggleMask]="true"
        [feedback]="false">
      </p-password>
    </div>

    <div class="form-field">
      <label for="password2">Repetir contraseña</label>
      <p-password
        inputId="password2"
        styleClass="full-width"
        [inputStyleClass]="'full-width'"
        placeholder="Repetir contraseña"
        formControlName="password2"
        [toggleMask]="true"
        [feedback]="false">
      </p-password>
    </div>

    <div class="form-field" formArrayName="pasatiempos">
      <div class="pasatiempos-header">
        <label>Pasatiempos</label>
        <button pButton type="button" label="Nuevo" icon="pi pi-plus" class="p-button-outlined p-button-sm" (click)="agregarPasatiempos()"></button>
      </div>

      <div class="pasatiempo-row" *ngFor="let pasatiempo of $any(forma.controls['pasatiempos']).controls; let i = index">
        <input type="text" pInputText class="full-width" [formControlName]="i" />
      </div>
    </div>

    <div class="form-status">
      <span>Estado del formulario:</span>
      <strong>{{ forma.status }}</strong>
    </div>

    <div class="form-actions">
      <button pButton type="submit" label="Guardar" icon="pi pi-check" [disabled]="!forma.valid"></button>
    </div>
  </p-card>
</form>
